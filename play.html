    --shell-hi: #457a52;

    top: 0;

    align-items: center;

#screens {

    flex-direction: column;
    align-items: center;
}
canvas {
    display: block;
    background: #000;
    image-rendering: pixelated;
    border-radius: calc(var(--u) * 2);
}
#top { width: calc(var(--u) * 400); height: calc(var(--u) * 240); }
#bottom { width: calc(var(--u) * 320); height: calc(var(--u) * 240); }
#hinge { height: calc(var(--u) * 8); }

#pad {
    position: relative;
    width: calc(var(--u) * 400);
    height: var(--padh, 200px);
}
body.nopad #pad { display: none; }
#pad button {
    position: absolute;
    border: none;
    background: var(--btn);
    color: var(--btn-ink);
    font: inherit;
    font-weight: bold;
    touch-action: none;
}
#pad button.on { filter: brightness(1.8); }
.sh { top: 8px; width: 30%; height: 34px; font-size: 15px; }
.sh[data-btn="l"] { left: 0; border-radius: 6px 18px 18px 6px; }
.sh[data-btn="r"] { right: 0; border-radius: 18px 6px 6px 18px; }

#dpad {
    position: absolute;
    left: 6%;
    top: 58px;
    width: 132px;
    height: 132px;
}
.d { width: 44px; height: 44px; border-radius: 6px; }
.d.up { left: 44px; top: 0; }
.d.down { left: 44px; top: 88px; }
.d.left { left: 0; top: 44px; }
.d.right { left: 88px; top: 44px; }
#dpad::after {
    content: "";
    position: absolute;
    left: 44px;
    top: 44px;
    width: 44px;
    height: 44px;
    background: var(--btn);
}

#abxy {
    position: absolute;
    right: 6%;
    top: 58px;
    width: 140px;
    height: 132px;
}
.f { width: 48px; height: 48px; border-radius: 50%; font-size: 17px; }
.f.x { left: 46px; top: 0; }
.f.b { left: 46px; top: 84px; }
.f.y { left: 0; top: 42px; }
.f.a { left: 92px; top: 42px; background: #b03048 !important; }

#start {
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: 76px;
    height: 24px;
    border-radius: 12px;
    font-size: 11px;
}

/* ----- スマホを横に持ったとき ----- */
#rotate {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--body);
    color: #fff;
    font-size: 22px;
    align-items: center;
    justify-content: center;
    z-index: 10;
}
@media (pointer: coarse) and (orientation: landscape) and (max-height: 500px) {
    #rotate { display: flex; }
}

      text(ctx, `なかま ${list.length} 体　[ ] は ウォッチの 場所${list.length > ZUKAN_ROWS ? `　${nIndex + 1}/${list.length}` : ""}`, 8, 220, { size: 10, color: COLORS.sub });
    }
    function drawWatch(ctx) {
      SLOT_BTN.forEach((b, i) => {
        const m = g.watch[i] ? medalByUid(g, g.watch[i]) : null;
        panel(ctx, b.x, b.y, b.w, b.h, { fill: i === slot ? "#2d5aa8" : "rgba(26,36,64,0.95)", edge: i === slot ? COLORS.accent : i < 3 ? "#ffd84a66" : COLORS.panelEdge });
        if (!m) {
          text(ctx, "あき", b.x + b.w / 2, b.y + 25, { size: 11, align: "center", color: COLORS.dim });
          return;
        }
        drawArt(ctx, ART[unitOf(m.id).art], 0, b.x + 18, b.y + 34, { scale: 1.6 });
        text(ctx, unitOf(m.id).name, b.x + 36, b.y + 17, { size: 10, bold: true, maxWidth: b.w - 40 });
        text(ctx, `Lv${m.lv}`, b.x + 36, b.y + 32, { size: 10, color: COLORS.sub });
      });
      if (!picking) {
        text(ctx, "上の 3 つが はじめに 前に 出る", 8, 140, { size: 9.5, color: COLORS.dim });
        text(ctx, `${btn("a")}・タップ: メダルを 入れる　${btn("y")} はずす`, 160, 160, { size: 11, align: "center", color: COLORS.sub });
        text(ctx, `メダル帳: ${g.medals.length} 枚`, 160, 180, { size: 11, align: "center", color: COLORS.sub });
        return;
      }
      const list = box();
      const top = scroll(listIndex, ROWS, list.length);
      for (let k = 0; k < ROWS && top + k < list.length; k++) {
        const m = list[top + k], y = LIST_TOP + k * ROW_H;
        if (top + k === listIndex) {
          roundRect(ctx, 8, y, 304, ROW_H - 2, 4);
          ctx.fillStyle = "#2d5aa8";
          ctx.fill();
        }
        const inWatch = g.watch.indexOf(m.uid);
        text(ctx, `${unitOf(m.id).name}`, 16, y + 14, { size: 12 });
        text(ctx, `Lv${m.lv}${inWatch >= 0 ? `  [${inWatch + 1}]` : ""}`, 304, y + 14, { size: 11, align: "right", color: COLORS.sub });
      }
    }
    function drawZukan(ctx) {
      const top = scroll(zIndex, ZUKAN_ROWS, NAKAMA_IDS.length);
      for (let k = 0; k < ZUKAN_ROWS && top + k < NAKAMA_IDS.length; k++) {
        const id = NAKAMA_IDS[top + k], y = 36 + k * ROW_H;
        if (top + k === zIndex) {
          roundRect(ctx, 8, y, 304, ROW_H - 2, 4);
          ctx.fillStyle = "#2d5aa8";
          ctx.fill();
        }
        const seen = g.zukan.seen[id] || g.zukan.friends[id];
        text(ctx, `${String(NAKAMA[id].no).padStart(3, "0")}  ${seen ? NAKAMA[id].name : "？？？"}`, 16, y + 14, { size: 12, color: seen ? COLORS.ink : COLORS.dim });
        if (g.zukan.friends[id]) text(ctx, "なかま", 304, y + 14, { size: 10.5, align: "right", color: COLORS.accent, bold: true });
      }
      text(ctx, `なかまに した: ${friendCount(g)} / ${NAKAMA_IDS.length}`, 8, 221, { size: 10.5, color: COLORS.sub });
    }
    function drawQuests(ctx) {
      const list = questList(g);
      if (!list.length) {
        text(ctx, "まだ 依頼を うけていない", 160, 100, { size: 13, align: "center", color: COLORS.sub });
        text(ctx, "町の「…」の ふきだしの キャラに 話しかけよう", 160, 122, { size: 11, align: "center", color: COLORS.dim });
        return;
      }
      const top = scroll(qIndex, ZUKAN_ROWS, list.length);
      list.slice(top, top + ZUKAN_ROWS).forEach((q, k) => {
        const y = 36 + k * ROW_H, done = questState(g, q.id) === "done", p = questProgress(g, q);
        if (top + k === qIndex) {
          roundRect(ctx, 8, y, 304, ROW_H - 2, 4);
          ctx.fillStyle = "#2d5aa8";
          ctx.fill();
        }
        text(ctx, q.title, 16, y + 14, { size: 12, color: done ? COLORS.dim : COLORS.ink, maxWidth: 200 });
        text(ctx, done ? "おわり" : questReady(g, q) ? "♪ できた！" : `${p.now}/${p.need}`, 304, y + 14, { size: 10.5, align: "right", bold: !done, color: done ? COLORS.dim : questReady(g, q) ? "#ff9ad8" : COLORS.accent });
      });
      text(ctx, `うけている ${list.filter((q) => questState(g, q.id) === "active").length}・おわった ${list.filter((q) => questState(g, q.id) === "done").length}`, 8, 221, { size: 10.5, color: COLORS.sub });
    }
    function drawQuestTop(ctx) {
      const q = questList(g)[qIndex];
      if (!q) {
        text(ctx, "町の キャラの おねがいを きいて あげよう", 200, 120, { size: 14, align: "center", color: COLORS.sub });
        return;
      }
      const f = FRIENDS.find((x) => x.id === q.from), n = NAKAMA[f.kind];
      drawArt(ctx, ART[n.art], Math.floor(t * 2), 60, 110, { scale: 4 });
      text(ctx, n.name, 60, 134, { size: 11, align: "center", color: COLORS.sub });
      text(ctx, q.title, 120, 40, { size: 17, bold: true, color: COLORS.accent, maxWidth: 270 });
      text(ctx, `場所: ${f.label}`, 120, 62, { size: 11.5, color: COLORS.sub });
      const s = fitSize(ctx, q.ask, 265, 12, 4, 9.5);
      wrap(ctx, q.ask, 265, s).slice(0, 4).forEach((r3, i) => text(ctx, r3, 120, 86 + i * (s + 5), { size: s }));
      const p = questProgress(g, q), done = questState(g, q.id) === "done";
      const r2 = q.reward, reward = [r2.money ? `${r2.money}円` : "", r2.item ? `${ITEMS[r2.item].name} ${r2.n}こ` : ""].filter(Boolean).join("・");
      text(ctx, done ? "おわった 依頼" : questReady(g, q) ? `できた！ ${n.name}に 話しかけよう` : `すすみ: ${p.now} / ${p.need}`, 120, 178, { size: 13, bold: true, color: done ? COLORS.dim : questReady(g, q) ? "#ff9ad8" : COLORS.ink });
      text(ctx, `お礼: ${reward}`, 120, 200, { size: 12, color: COLORS.accent });
    }
    function drawItems(ctx) {
      Object.keys(ITEMS).forEach((id, k) => {
        const y = 36 + k * ROW_H;
        if (k === iIndex) {
          roundRect(ctx, 8, y, 304, ROW_H - 2, 4);
          ctx.fillStyle = "#2d5aa8";
          ctx.fill();
        }
        text(ctx, ITEMS[id].name, 16, y + 14, { size: 12 });
        text(ctx, `×${g.items[id] || 0}`, 304, y + 14, { size: 12, align: "right" });
      });
      text(ctx, `お金: ${g.money}円 (駄菓子屋で 買える)`, 8, 200, { size: 11, color: COLORS.sub });
    }
    return { name: "menu", update, drawTop, drawBottom };
  }
  const topCanvas = document.getElementById("top");
  const bottomCanvas = document.getElementById("bottom");
  const screens = setupScreens(topCanvas, bottomCanvas);
  if (!matchMedia("(pointer: coarse)").matches) document.body.classList.add("nopad");
  screens.layout();
  const input = createInput({ bottomCanvas, topCanvas, padRoot: document.getElementById("pad"), onPadChange: () => screens.layout() });
  const params = new URLSearchParams(location.search);
  const app = {
    version: params.get("v") === "menkyo" ? "menkyo" : "naitei",
    g: null,
    input,
    rng: createRng(Date.now() & 4294967295),
    talk: createTalk(),
    scene: null,
    field: null,
    get versionName() {
      return `${VERSIONS[this.version]}バージョン`;
    },
    setVersion(v) {
      this.version = v;
      document.body.classList.toggle("v-menkyo", v === "menkyo");
    },
    start(version, fresh) {
      this.setVersion(version);
      const saved = fresh ? null : loadSave(version);
      this.g = saved ? migrate(saved) : newGame(version, Date.now() & 65535);
      this.field = createField(this);
      this.scene = this.field;
      if (fresh) {
        this.talk.open([
          { who: "ともいし", art: "tomoishi", text: "こおりくん、夏休みだからって 家で ゴロゴロしてないで、外で 遊んできなさい！" },
          { who: "ともいし", art: "tomoishi", text: "そうそう、神社の ほうで ふるカワちゃんが さがしてたわよ。" }
        ]);
        this.save();
      }
    },
    save() {
      if (this.g) writeSave(this.version, this.g);
    },
    go(name) {
      if (name === "field") this.scene = this.field;
      else if (name === "menu") this.scene = createMenu(this);
      else if (name === "title") this.scene = createTitle(this);
    },
    // mystery: 七不思議の id (2 章。勝つと たしかめた ことに なる)
    startBattle({ enemies, kind, place, mystery = null }) {
      const allies = watchMedals(this.g).map((m) => m ? { uid: m.uid, id: m.id, lv: m.lv, bond: bondLevel(this.g, m.id) } : null);
      const battle = createBattle({ allies, enemies, rng: this.rng, kind, intro: true });
      battle.mystery = mystery;
      this.scene = createBattleView(this, battle, place);
    },
    endBattle(battle) {
      const result2 = applyBattleResult(this.g, battle, this.rng);
      if (result2.outcome === "flee") {
        this.backToField(result2);
        return;
      }
      if (result2.outcome === "lose") {
        this.g.pos = { x: 6 * 16 + 8, y: 24 * 16 + 12, dir: "down" };
      }
      this.save();
      this.scene = createResult(this, result2);
    },
    backToField(result2) {
      this.scene = this.field;
      this.field.afterBattle(result2);
      this.save();
    }
  };
  app.setVersion(app.version);
  app.scene = createTitle(app);
  window.__app = app;
  window.__bgm = currentBgm;
  function wantedBgm() {
    var _a;
    const sc = app.scene;
    const b = sc.battle;
    return bgmFor({
      scene: sc.name,
      area: app.g ? areaAt(Math.floor(app.g.pos.x / TILE), Math.floor(app.g.pos.y / TILE)) : null,
      battle: b ? { kind: b.kind, outcome: b.outcome, bossId: ((_a = b.enemies.find((e) => BOSSES[e.id])) == null ? void 0 : _a.id) ?? null } : null
    });
  }
  let last = performance.now(), saveTimer = 0;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1e3));
    last = now;
    input.update();
    if (input.touch.justDown || Object.values(input.pressed).some(Boolean)) unlockSound();
    if (app.talk.isActive()) app.talk.update(dt, input);
    else app.scene.update(dt, input);
    playBgm(wantedBgm());
    app.scene.drawTop(screens.top);
    app.scene.drawBottom(screens.bottom);
    if (app.g && app.scene === app.field) {
      saveTimer += dt;
      if (saveTimer > 30) {
        saveTimer = 0;
        app.save();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) app.save();
  });
  window.addEventListener("pagehide", () => app.save());
})();
</script>
