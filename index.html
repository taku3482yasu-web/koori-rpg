<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1b3a6b">
    <title>こおりくんの大冒険～大集合だヨ！おともだち！～</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="device">
        <div id="screens">
            <canvas id="top" aria-label="上画面"></canvas>
            <div id="hinge"></div>
            <canvas id="bottom" aria-label="下画面 (さわれる)"></canvas>
        </div>
        <div id="pad" aria-hidden="true">
            <button class="sh" data-btn="l">L</button>
            <button class="sh" data-btn="r">R</button>
            <div id="dpad">
                <button data-btn="up" class="d up"></button>
                <button data-btn="left" class="d left"></button>
                <button data-btn="right" class="d right"></button>
                <button data-btn="down" class="d down"></button>
            </div>
            <div id="abxy">
                <button data-btn="x" class="f x">X</button>
                <button data-btn="y" class="f y">Y</button>
                <button data-btn="a" class="f a">A</button>
                <button data-btn="b" class="f b">B</button>
            </div>
            <button id="start" data-btn="start">START</button>
        </div>
    </div>
    <div id="rotate">スマホを たてに してね</div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
