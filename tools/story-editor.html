<title>こおりくん ストーリー工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 3 列: 章の 目次 | 台本 (場面と セリフ) | ゲームの 会話画面で プレビュー。スマホは たてに 1 列 */
:root {
    --bg: #eef3f8; --panel: #ffffff; --ink: #1b2636; --sub: #5b6b80; --line: #cfdbe8;
    --ice: #2f86c8; --ice-soft: #dcecf8; --done: #2f9e6a; --wip: #d08a1a; --todo: #8a96a8; --danger: #c44141;
    --screen: #0e1a2c; --screen-ink: #f4f8ff;
    --display: 'DotGothic16', 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    --body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1622; --panel: #172131; --ink: #e6eef8; --sub: #93a3b8; --line: #2a3a50;
    --ice: #6cb8ec; --ice-soft: #1d3248; --done: #4cc28b; --wip: #f0a83a; --todo: #8190a5; --danger: #ff7b7b;
    --screen: #08111e; --screen-ink: #f4f8ff; color-scheme: dark;
} }
:root[data-theme="dark"] {
    --bg: #0f1622; --panel: #172131; --ink: #e6eef8; --sub: #93a3b8; --line: #2a3a50;
    --ice: #6cb8ec; --ice-soft: #1d3248; --done: #4cc28b; --wip: #f0a83a; --todo: #8190a5; --danger: #ff7b7b;
    --screen: #08111e; --screen-ink: #f4f8ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.6; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
header.top h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0.04em; text-wrap: balance; }
header.top .tag { color: var(--sub); font-size: 13px; }
#status { margin-left: auto; font-size: 12px; color: var(--sub); }
#status.err { color: var(--danger); }
.banner { padding: 8px 12px; border-radius: 8px; background: var(--ice-soft); color: var(--ink); font-size: 13px; }
.banner[hidden] { display: none; }
.grid { display: grid; grid-template-columns: 220px minmax(0, 1fr) 420px; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .grid { grid-template-columns: 200px minmax(0, 1fr); } .preview { grid-column: 1 / -1; } }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.panel h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 15px; letter-spacing: 0.06em; color: var(--sub); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--ice); outline-offset: 1px; }
.btn { padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); }
.btn:hover { border-color: var(--ice); }
.btn.main { background: var(--ice); border-color: var(--ice); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 2px 8px; font-size: 12px; }
/* 目次 */
.chlist { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.chlist button { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; padding: 6px 8px; border: 1px solid transparent; border-radius: 7px; background: none; text-align: left; }
.chlist button:hover { background: var(--ice-soft); }
.chlist button.on { border-color: var(--ice); background: var(--ice-soft); }
.chlist .no { font-family: var(--display); color: var(--ice); font-variant-numeric: tabular-nums; }
.chlist .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.chlist .st { grid-column: 2; font-size: 11px; }
.pill { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; color: #fff; }
.pill.done { background: var(--done); } .pill.wip { background: var(--wip); } .pill.todo { background: var(--todo); }
/* 台本 */
.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.field label { font-size: 12px; color: var(--sub); letter-spacing: 0.04em; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 10px; }
.row2b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 520px) { .row2, .row2b { grid-template-columns: minmax(0, 1fr); } }
input[type=text], textarea, select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit; }
textarea { resize: vertical; min-height: 2.4em; }
.chtitle { font-size: 18px; font-weight: 700; }
.scenes { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.scene { border: 1px solid var(--line); border-radius: 9px; }
.scene > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
.scene > summary::-webkit-details-marker { display: none; }
.scene > summary .sn { font-family: var(--display); color: var(--ice); font-variant-numeric: tabular-nums; }
.scene > summary .stt { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scene > summary .cnt { margin-left: auto; font-size: 12px; color: var(--sub); white-space: nowrap; }
.scene[open] > summary { border-bottom: 1px solid var(--line); }
.scene .body { padding: 10px; }
.lines { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 8px; }
.ln { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 4px 6px; align-items: start; padding: 6px 4px; border-radius: 7px; border-bottom: 1px dashed var(--line); }
.ln .who { flex-direction: row !important; flex-wrap: wrap; max-width: 420px; }
.ln .who select { width: auto; min-width: 0; max-width: 100%; }
.ln .who input { flex: 1 1 140px; width: auto; }
.ln textarea { grid-column: 2 / 4; }
.ln.cur { background: var(--ice-soft); }
.ln .i { font-family: var(--display); color: var(--sub); font-size: 12px; padding-top: 7px; text-align: right; font-variant-numeric: tabular-nums; }
.ln .who { display: flex; flex-direction: column; gap: 4px; }
.ln .ops { display: flex; gap: 2px; }
.ln .ops button { width: 28px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 12px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.empty { color: var(--sub); padding: 16px 4px; }
.hint { color: var(--sub); font-size: 12px; }
/* プレビュー */
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 1100px) { .preview { position: static; } }
.screen { display: block; width: 100%; max-width: 100%; aspect-ratio: 400 / 240; border-radius: 6px; background: var(--screen); image-rendering: pixelated; cursor: pointer; }
.pvbar { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--sub); }
.pvbar .pos { margin-right: auto; font-variant-numeric: tabular-nums; }
.copied { color: var(--done); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
    <header class="top">
        <h1>こおりくん ストーリー工房</h1>
        <span class="tag">こおりくんの大冒険～大集合だヨ！おともだち！～ の 台本</span>
        <span id="status">つないでいます…</span>
    </header>
    <p class="banner" id="banner" hidden></p>
    <div class="grid">
        <nav class="panel" aria-label="章">
            <h2>章</h2>
            <ul class="chlist" id="chlist"></ul>
            <div class="acts"><button class="btn small" id="addCh" type="button">＋ 章を 足す</button></div>
        </nav>
        <main class="panel" id="editor"></main>
        <aside class="panel preview" aria-label="プレビュー">
            <h2>ゲームの 会話画面で 見る</h2>
            <canvas class="screen" id="screen" width="400" height="240" title="クリックで つぎの セリフ"></canvas>
            <div class="pvbar">
                <span class="pos" id="pvpos">セリフを えらぶと ここに 出ます</span>
                <button class="btn small" id="pvPrev" type="button">◀ まえ</button>
                <button class="btn small" id="pvNext" type="button">つぎ ▶</button>
            </div>
            <p class="hint">上画面 (400×240) と 同じ 大きさです。文字は ひらがな多め・ことばの 区切りで スペースを 入れると ゲームと 同じに なります。</p>
            <div class="acts"><button class="btn small" id="copyAll" type="button">ぜんぶの 台本を コピー (JSON)</button><span class="copied" id="copied"></span></div>
        </aside>
    </div>
</div>

<script>
const CAST = /*CAST*/[];
const ART = /*ART*/{};
const STATUS = { done: 'ゲームに 入っている', wip: '書きかけ', todo: 'これから' };
const LOCAL_KEY = 'koori-story-draft';

const $ = (s, el = document) => el.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let chapters = {};          // id → { no, title, status, summary, scenes: [{ id, title, where, when, memo, lines: [{ who, art, text }] }] }
let selCh = null;           // 見ている 章の id
let pv = { scene: null, i: 0 };   // プレビューの 場面と セリフ番号
let db = null, canWrite = true;
const dirty = new Map();    // 章 id → 保存待ちの タイマー
const saving = new Set();

// ---------- 保存 ----------
function setStatus(t, err = false) { const s = $('#status'); s.textContent = t; s.classList.toggle('err', err); }
function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(chapters)); } catch { /* 保存できない ブラウザ */ } }
function touch(id) {
    saveLocal();
    if (!db || !canWrite) return;
    clearTimeout(dirty.get(id));
    setStatus('書いています…');
    dirty.set(id, setTimeout(() => flush(id), 900));
}
async function flush(id) {
    if (saving.has(id)) { dirty.set(id, setTimeout(() => flush(id), 400)); return; }
    dirty.delete(id);
    saving.add(id);
    try {
        if (chapters[id]) await db.doc('chapters/' + id).set({ ...structuredClone(chapters[id]), updatedAt: new Date().toISOString() });
        else await db.doc('chapters/' + id).delete();
        if (!dirty.size) setStatus('保存しました ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }));
    } catch (e) {
        if (e?.code === 'invalid_argument' && !canWrite) setStatus('見るだけ', true);
        else setStatus('保存できませんでした (' + (e?.code || 'error') + ')。少し待って もう一度 書くと 保存します', true);
    } finally { saving.delete(id); }
}

// ---------- 目次 ----------
const sortedIds = () => Object.keys(chapters).sort((a, b) => (chapters[a].no ?? 0) - (chapters[b].no ?? 0));
function renderList() {
    const ids = sortedIds();
    $('#chlist').innerHTML = ids.length ? ids.map(id => {
        const c = chapters[id];
        const st = c.status || 'todo';
        return `<li><button type="button" data-ch="${id}" class="${id === selCh ? 'on' : ''}"><span class="no">${c.no}章</span><span class="tt">${esc(c.title) || '（題名なし）'}</span><span class="st"><span class="pill ${st}">${STATUS[st]}</span></span></button></li>`;
    }).join('') : '<li class="hint">まだ 章が ありません</li>';
}

// ---------- 台本 ----------
function speakerSelect(l) {
    const known = l.who === '' || CAST.some(c => c.name === l.who);
    const opt = (v, t, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(t)}</option>`;
    const groups = {};
    for (const c of CAST) (groups[c.group || 'おもな 人'] ||= []).push(c);
    return `<select data-k="who" aria-label="話す人">
        ${opt('', 'ナレーション (地の文)', l.who === '')}
        ${Object.entries(groups).map(([g, list]) => `<optgroup label="${g}">${list.map(c => opt(c.name, c.name, c.name === l.who)).join('')}</optgroup>`).join('')}
        <optgroup label="ほかの人">${opt('*', 'ほかの人 (名前を 書く)', !known)}</optgroup>
    </select>${known ? '' : `<input type="text" data-k="custom" value="${esc(l.who)}" placeholder="名前 (例: お店の人)" aria-label="名前">`}`;
}
function lineHTML(l, i, sc) {
    const cur = pv.scene === sc.id && pv.i === i;
    return `<div class="ln${cur ? ' cur' : ''}" data-line="${i}">
        <span class="i">${i + 1}</span>
        <div class="who">${speakerSelect(l)}</div>
        <textarea data-k="text" rows="2" aria-label="セリフ" placeholder="${l.who ? '「セリフ」' : 'ナレーション'}">${esc(l.text)}</textarea>
        <div class="ops"><button type="button" data-op="up" title="上へ">↑</button><button type="button" data-op="down" title="下へ">↓</button><button type="button" data-op="ins" title="この下に 1 行 足す">＋</button><button type="button" data-op="del" title="消す">×</button></div>
    </div>`;
}
function sceneHTML(sc, n, open) {
    return `<details class="scene" data-scene="${sc.id}"${open ? ' open' : ''}>
        <summary><span class="sn">${n}</span><span class="stt">${esc(sc.title) || '（場面の 名前なし）'}</span><span class="cnt">${sc.lines.length} 行</span></summary>
        <div class="body">
            <div class="row2b">
                <div class="field"><label for="t-${sc.id}">場面の 名前</label><input type="text" id="t-${sc.id}" data-s="title" value="${esc(sc.title)}" placeholder="例: 神社で ふるカワに 会う"></div>
                <div class="field"><label for="w-${sc.id}">場所</label><input type="text" id="w-${sc.id}" data-s="where" value="${esc(sc.where)}" placeholder="例: 石の川神社"></div>
            </div>
            <div class="field"><label for="k-${sc.id}">きっかけ (いつ・なにを したら 始まるか)</label><input type="text" id="k-${sc.id}" data-s="when" value="${esc(sc.when)}" placeholder="例: 夜に 学校の 入り口を しらべる"></div>
            <div class="field"><label for="m-${sc.id}">メモ (演出・バトル・もらえる もの など)</label><textarea id="m-${sc.id}" data-s="memo" rows="2" placeholder="例: このあと ボス戦。勝つと ○○が なかまに なる">${esc(sc.memo)}</textarea></div>
            <label class="hint">セリフ</label>
            <div class="lines">${sc.lines.map((l, i) => lineHTML(l, i, sc)).join('') || '<p class="empty">まだ セリフが ありません</p>'}</div>
            <div class="acts">
                <button type="button" class="btn small main" data-op="addLine">＋ セリフ</button>
                <button type="button" class="btn small" data-op="play">▶ 最初から 見る</button>
                <button type="button" class="btn small" data-op="sUp">場面を 上へ</button>
                <button type="button" class="btn small" data-op="sDown">場面を 下へ</button>
                <button type="button" class="btn small danger" data-op="sDel">場面を 消す</button>
            </div>
        </div>
    </details>`;
}
function renderEditor() {
    const ed = $('#editor');
    const c = chapters[selCh];
    if (!c) {
        ed.innerHTML = `<h2>台本</h2><p class="empty">左の「＋ 章を 足す」で 章を つくると、ここに 場面と セリフを 書けます。</p>`;
        return;
    }
    const open = new Set([...ed.querySelectorAll('details.scene[open]')].map(d => d.dataset.scene));
    if (pv.scene && c.scenes.some(s => s.id === pv.scene)) open.add(pv.scene);
    ed.innerHTML = `<h2>${c.no}章の 台本</h2>
        <div class="row2">
            <div class="field"><label for="ct">章の 題名</label><input type="text" id="ct" class="chtitle" data-c="title" value="${esc(c.title)}" placeholder="例: 学校の七不思議"></div>
            <div class="field"><label for="cs">ようす</label><select id="cs" data-c="status">${Object.entries(STATUS).map(([k, t]) => `<option value="${k}"${k === (c.status || 'todo') ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label for="cm">あらすじ</label><textarea id="cm" data-c="summary" rows="4" placeholder="この 章で おきること・はじまりと おわり">${esc(c.summary)}</textarea></div>
        <h2>場面 (${c.scenes.length})</h2>
        <div class="scenes">${c.scenes.map((s, i) => sceneHTML(s, i + 1, open.has(s.id))).join('') || '<p class="empty">まだ 場面が ありません。下の ボタンで 足してください。</p>'}</div>
        <div class="acts" style="margin-top:10px">
            <button type="button" class="btn main" data-op="addScene">＋ 場面を 足す</button>
            <span style="margin-left:auto"></span>
            <button type="button" class="btn small" data-op="cUp">章を 前へ</button>
            <button type="button" class="btn small" data-op="cDown">章を 後ろへ</button>
            <button type="button" class="btn small danger" data-op="cDel">章を 消す</button>
        </div>`;
}
function render() { renderList(); renderEditor(); drawPreview(); }

// ---------- さわる ----------
const ctx = el => {
    const c = chapters[selCh];
    const sEl = el.closest('[data-scene]');
    const sc = sEl ? c?.scenes.find(s => s.id === sEl.dataset.scene) : null;
    const lEl = el.closest('[data-line]');
    return { c, sc, i: lEl ? +lEl.dataset.line : -1 };
};
let armed = null;   // 消す ボタンは 2 回 おす
function confirmTwice(btn, key) {
    if (armed === key) { armed = null; return true; }
    armed = key;
    const was = btn.textContent;
    btn.textContent = 'もう一度 おすと 消えます';
    setTimeout(() => { if (armed === key) { armed = null; btn.textContent = was; } }, 2500);
    return false;
}
$('#chlist').addEventListener('click', e => {
    const b = e.target.closest('[data-ch]');
    if (!b) return;
    selCh = b.dataset.ch;
    pv = { scene: chapters[selCh].scenes[0]?.id ?? null, i: 0 };
    render();
});
$('#addCh').addEventListener('click', () => {
    const no = Math.max(0, ...Object.values(chapters).map(c => c.no ?? 0)) + 1;
    const id = 'ch' + String(no).padStart(2, '0') + (chapters['ch' + String(no).padStart(2, '0')] ? newId('_') : '');
    chapters[id] = { no, title: '', status: 'todo', summary: '', scenes: [] };
    selCh = id;
    touch(id);
    render();
    $('#ct')?.focus();
});
const editor = $('#editor');
editor.addEventListener('input', e => {
    const el = e.target;
    const { c, sc, i } = ctx(el);
    if (!c) return;
    if (el.dataset.c) { c[el.dataset.c] = el.value; if (el.dataset.c === 'title') renderList(); }
    else if (el.dataset.s && sc) { sc[el.dataset.s] = el.value; if (el.dataset.s === 'title') el.closest('details').querySelector('.stt').textContent = el.value || '（場面の 名前なし）'; }
    else if (sc && i >= 0) {
        const l = sc.lines[i];
        if (el.dataset.k === 'text') l.text = el.value;
        if (el.dataset.k === 'custom') { l.who = el.value; l.art = ''; }
        pv = { scene: sc.id, i };
        drawPreview();
    }
    touch(selCh);
});
editor.addEventListener('change', e => {
    const el = e.target;
    const { c, sc, i } = ctx(el);
    if (el.dataset.c === 'status') { renderList(); touch(selCh); return; }
    if (el.dataset.k !== 'who' || !sc) return;
    const l = sc.lines[i];
    if (el.value === '*') { l.who = l.who && !CAST.some(x => x.name === l.who) ? l.who : 'ほかの人'; l.art = ''; }
    else { l.who = el.value; l.art = CAST.find(x => x.name === el.value)?.art || ''; }
    pv = { scene: sc.id, i };
    touch(selCh);
    renderEditor();
    drawPreview();
    if (el.value === '*') editor.querySelector(`[data-scene="${sc.id}"] [data-line="${i}"] [data-k="custom"]`)?.select();
});
editor.addEventListener('focusin', e => {
    const { sc, i } = ctx(e.target);
    if (sc && i >= 0 && (pv.scene !== sc.id || pv.i !== i)) { pv = { scene: sc.id, i }; markCur(); drawPreview(); }
});
editor.addEventListener('click', e => {
    const b = e.target.closest('button[data-op]');
    if (!b) return;
    const { c, sc, i } = ctx(b);
    const op = b.dataset.op;
    const move = (list, a, d) => { const j = a + d; if (j < 0 || j >= list.length) return false; [list[a], list[j]] = [list[j], list[a]]; return true; };
    let focusLine = -1;
    if (op === 'addScene') {
        const s = { id: newId('s'), title: '', where: '', when: '', memo: '', lines: [] };
        c.scenes.push(s);
        pv = { scene: s.id, i: 0 };
    } else if (op === 'addLine') {
        const last = sc.lines[sc.lines.length - 1];
        sc.lines.push({ who: last ? last.who : '', art: last ? last.art : '', text: '' });
        focusLine = sc.lines.length - 1;
    } else if (op === 'ins') {
        sc.lines.splice(i + 1, 0, { who: sc.lines[i].who, art: sc.lines[i].art, text: '' });
        focusLine = i + 1;
    } else if (op === 'up' || op === 'down') {
        if (!move(sc.lines, i, op === 'up' ? -1 : 1)) return;
        pv = { scene: sc.id, i: i + (op === 'up' ? -1 : 1) };
    } else if (op === 'del') {
        if (sc.lines[i].text && !confirmTwice(b, sc.id + i)) return;
        sc.lines.splice(i, 1);
        pv = { scene: sc.id, i: Math.max(0, Math.min(i, sc.lines.length - 1)) };
    } else if (op === 'play') {
        pv = { scene: sc.id, i: 0 }; markCur(); drawPreview(); return;
    } else if (op === 'sUp' || op === 'sDown') {
        if (!move(c.scenes, c.scenes.indexOf(sc), op === 'sUp' ? -1 : 1)) return;
    } else if (op === 'sDel') {
        if (!confirmTwice(b, sc.id)) return;
        c.scenes.splice(c.scenes.indexOf(sc), 1);
    } else if (op === 'cUp' || op === 'cDown') {
        const ids = sortedIds();
        const k = ids.indexOf(selCh), j = k + (op === 'cUp' ? -1 : 1);
        if (j < 0 || j >= ids.length) return;
        const other = chapters[ids[j]];
        [c.no, other.no] = [other.no, c.no];
        touch(ids[j]);
    } else if (op === 'cDel') {
        if (!confirmTwice(b, selCh)) return;
        delete chapters[selCh];
        touch(selCh);
        selCh = sortedIds()[0] ?? null;
        render();
        return;
    } else return;
    touch(selCh);
    if (focusLine >= 0) pv = { scene: sc.id, i: focusLine };
    render();
    if (focusLine >= 0) editor.querySelector(`[data-scene="${sc.id}"] [data-line="${focusLine}"] textarea`)?.focus();
});
function markCur() {
    editor.querySelectorAll('.ln.cur').forEach(el => el.classList.remove('cur'));
    editor.querySelector(`[data-scene="${pv.scene}"] [data-line="${pv.i}"]`)?.classList.add('cur');
}

// ---------- プレビュー (ゲームの talk.js と 同じ ならび: 立ち絵 + ふきだし) ----------
const cv = $('#screen'), g = cv.getContext('2d');
function curScene() { return chapters[selCh]?.scenes.find(s => s.id === pv.scene) || null; }
function drawArt(a, cx, bottom, maxW, maxH) {
    const s = Math.max(1, Math.floor(Math.min(maxW / a.w, maxH / a.h)));
    const left = Math.round(cx - a.w * s / 2), top = Math.round(bottom - a.h * s);
    a.f.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const ch = row[x]; if (ch === '.') continue; g.fillStyle = a.p[ch]; g.fillRect(left + x * s, top + y * s, s, s); } });
}
function wrapText(t, w) {
    const out = [];
    for (const para of String(t).split('\n')) {
        let line = '';
        for (const ch of para) {
            if (g.measureText(line + ch).width > w) { out.push(line); line = ch.trim() ? ch : ''; } else line += ch;
        }
        out.push(line);
    }
    return out;
}
function drawPreview() {
    const sc = curScene();
    const l = sc?.lines[pv.i];
    const sky = g.createLinearGradient(0, 0, 0, 240);
    sky.addColorStop(0, '#7cc4f0'); sky.addColorStop(0.62, '#cfe9f7'); sky.addColorStop(0.62, '#8cc56e'); sky.addColorStop(1, '#5f9e4a');
    g.fillStyle = sky; g.fillRect(0, 0, 400, 240);
    g.font = '14px DotGothic16, monospace';
    g.textBaseline = 'top';
    if (!l) {
        g.fillStyle = 'rgba(14,26,44,0.75)'; g.fillRect(0, 96, 400, 48);
        g.fillStyle = '#f4f8ff'; g.textAlign = 'center';
        g.fillText(sc ? 'この 場面には まだ セリフが ありません' : 'セリフを えらぶと ここに 出ます', 200, 112);
        g.textAlign = 'left';
        $('#pvpos').textContent = sc ? (sc.title || '場面') : 'セリフを えらぶと ここに 出ます';
        return;
    }
    const a = l.art && ART[l.art];
    if (a) drawArt(a, 300, 158, 150, 140);
    // ふきだし
    g.fillStyle = 'rgba(14,26,44,0.92)'; g.fillRect(8, 160, 384, 74);
    g.strokeStyle = '#f4f8ff'; g.lineWidth = 2; g.strokeRect(9, 161, 382, 72);
    if (l.who) {
        const nw = g.measureText(l.who).width + 20;
        g.fillStyle = '#2f86c8'; g.fillRect(14, 140, nw, 22);
        g.strokeRect(14, 140, nw, 22);
        g.fillStyle = '#ffffff'; g.fillText(l.who, 24, 144);
    }
    g.fillStyle = '#f4f8ff';
    const rows = wrapText(l.text || '…', 360);
    rows.slice(0, 3).forEach((r, k) => g.fillText(r, 20, 172 + k * 19));
    if (rows.length > 3) { g.fillStyle = '#f0a83a'; g.fillText('…入りきらない (3 行まで)', 210, 214); }
    $('#pvpos').textContent = `${sc.title || '場面'}　${pv.i + 1} / ${sc.lines.length}`;
}
function step(d) {
    const sc = curScene();
    if (!sc || !sc.lines.length) return;
    pv.i = Math.max(0, Math.min(sc.lines.length - 1, pv.i + d));
    markCur(); drawPreview();
}
cv.addEventListener('click', () => step(1));
$('#pvPrev').addEventListener('click', () => step(-1));
$('#pvNext').addEventListener('click', () => step(1));
$('#copyAll').addEventListener('click', async () => {
    const text = JSON.stringify(sortedIds().map(id => ({ id, ...chapters[id] })), null, 2);
    try { await navigator.clipboard.writeText(text); $('#copied').textContent = 'コピーしました'; }
    catch { $('#copied').textContent = 'コピーできませんでした'; }
    setTimeout(() => { $('#copied').textContent = ''; }, 2500);
});
document.fonts?.ready.then(drawPreview);

// ---------- はじめ ----------
function adopt(list) {
    for (const [id, c] of Object.entries(list)) {
        if (dirty.has(id) || saving.has(id)) continue;   // 書いている 途中の 章は そのまま
        chapters[id] = { no: c.no ?? 0, title: c.title ?? '', status: c.status ?? 'todo', summary: c.summary ?? '', scenes: (c.scenes ?? []).map(s => ({ id: s.id || newId('s'), title: s.title ?? '', where: s.where ?? '', when: s.when ?? '', memo: s.memo ?? '', lines: (s.lines ?? []).map(l => ({ who: l.who ?? '', art: l.art ?? '', text: l.text ?? '' })) })) };
    }
    if (!selCh || !chapters[selCh]) selCh = sortedIds().find(id => chapters[id].status !== 'done') ?? sortedIds()[0] ?? null;
    if (selCh && !curScene()) pv = { scene: chapters[selCh].scenes[0]?.id ?? null, i: 0 };
}
function focusedInEditor() { return editor.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName); }
(async () => {
    render();
    db = window.claude?.use ? await window.claude.use('db') : null;
    if (!db) {
        try { adopt(JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}')); } catch { /* なし */ }
        const b = $('#banner'); b.hidden = false;
        b.textContent = 'いまは 保存先に つながっていません。書いた ものは この ブラウザの 中にだけ のこります。claude.ai で ひらくと Claude も 読める 場所に 保存されます。';
        setStatus('この ブラウザに 保存');
        render();
        return;
    }
    const user = await window.claude.use('user');
    const w = user ? await user.can('data.write') : null;
    if (w === false) { canWrite = false; const b = $('#banner'); b.hidden = false; b.textContent = '見るだけの 共有です。書きかえは 保存されません。'; }
    let first = true;
    db.collection('chapters').onSnapshot(snap => {
        const list = {};
        for (const d of snap.docs) list[d.id] = d.data();
        for (const id of Object.keys(chapters)) if (!list[id] && !dirty.has(id) && !saving.has(id)) delete chapters[id];
        adopt(list);
        if (first) { first = false; setStatus(canWrite ? '保存先に つながりました' : '見るだけ'); }
        if (focusedInEditor()) { renderList(); return; }   // 書いている 最中は 台本を 描きなおさない
        render();
    }, e => setStatus('保存先から 読めませんでした (' + e.code + ')', true));
})();
</script>
